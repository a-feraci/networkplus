<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NeTwOrK+ // Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NeTwOrK+  ·  kawaii-cyberpunk CompTIA Network+ study deck
   ============================================================ */
:root{
  --bg0:#150a2e; --bg1:#1d0f42; --bg2:#23114f;
  --pink:#ff4fd8; --pink-soft:#ff9fe8; --pink-pastel:#ffc9f0;
  --purple:#a86bff; --purple-soft:#c6a4ff; --purple-pastel:#e0d2ff;
  --green:#48ffc0; --green-soft:#8effd8; --green-pastel:#caffe9;
  --white:#ffffff; --ink:#fdeeff; --ink-dim:#cdb9e6;
  --card:rgba(45,22,86,.55); --card-line:rgba(255,159,232,.35);
  --glow-pink:0 0 12px rgba(255,79,216,.7);
  --glow-green:0 0 12px rgba(72,255,192,.7);
  --glow-purple:0 0 12px rgba(168,107,255,.7);
  --radius:26px;
  --f-title:'Press Start 2P',monospace;
  --f-head:'Baloo 2',cursive;
  --f-body:'Quicksand',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--f-body);
  color:var(--ink);
  overflow:hidden;                 /* page itself never scrolls */
  display:flex;flex-direction:column;
  background:var(--bg0);
  -webkit-tap-highlight-color:transparent;
}
/* ---- fixed, non-scrolling background ---- */
#bg{
  position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(900px 600px at 12% 8%, rgba(255,79,216,.22), transparent 60%),
    radial-gradient(900px 700px at 88% 18%, rgba(168,107,255,.25), transparent 60%),
    radial-gradient(1000px 700px at 70% 95%, rgba(72,255,192,.18), transparent 60%),
    linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));
}
#grid{
  position:fixed;inset:-50% 0 0 0;z-index:-2;height:200%;
  background-image:
    linear-gradient(rgba(255,159,232,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(198,164,255,.10) 1px,transparent 1px);
  background-size:46px 46px;
  transform:perspective(420px) rotateX(58deg) translateY(0);
  animation:gridmove 9s linear infinite;
  opacity:.55;mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 60%,transparent);
}
@keyframes gridmove{from{background-position:0 0;}to{background-position:0 46px;}}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--pink-soft);
  box-shadow:var(--glow-pink);animation:tw 3s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7);}50%{opacity:1;transform:scale(1.3);}}

/* ---------------- HEADER (robot + title + master bar) --------------- */
header{
  flex:0 0 auto;text-align:center;padding:10px 12px 6px;position:relative;z-index:5;
}
#robot{width:74px;height:74px;display:inline-block;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(var(--glow-green));}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-7px) rotate(2deg);}}
.robot-eye{animation:blink 4s infinite;transform-origin:center;}
@keyframes blink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.1);}}

h1#title{
  font-family:var(--f-title);font-size:clamp(20px,5vw,40px);margin:4px 0 2px;letter-spacing:1px;
  position:relative;display:inline-block;color:var(--white);
  text-shadow:0 0 6px var(--pink),0 0 16px rgba(255,79,216,.7);
}
h1#title::before,h1#title::after{
  content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;
}
h1#title::before{color:var(--green);text-shadow:0 0 8px var(--green);
  animation:glitchA 2.6s infinite linear alternate-reverse;clip-path:inset(0 0 60% 0);}
h1#title::after{color:var(--purple);text-shadow:0 0 8px var(--purple);
  animation:glitchB 2.1s infinite linear alternate-reverse;clip-path:inset(55% 0 0 0);}
@keyframes glitchA{0%{transform:translate(0,0);}20%{transform:translate(-3px,1px);}40%{transform:translate(2px,-1px);}60%{transform:translate(-2px,0);}80%{transform:translate(3px,1px);}100%{transform:translate(0,0);}}
@keyframes glitchB{0%{transform:translate(0,0);}25%{transform:translate(3px,-1px);}50%{transform:translate(-3px,1px);}75%{transform:translate(2px,1px);}100%{transform:translate(0,0);}}
.subtitle{font-family:var(--f-head);color:var(--green-soft);font-size:13px;margin:0 0 6px;letter-spacing:.5px;}

/* master progress bar (always visible, top of page) */
#master-wrap{max-width:680px;margin:2px auto 0;padding:0 10px;}
#master-bar-shell{height:18px;border-radius:30px;background:rgba(20,8,46,.7);
  border:1.5px solid var(--card-line);overflow:hidden;position:relative;box-shadow:inset 0 0 8px rgba(0,0,0,.4);}
#master-bar-fill{height:100%;width:0%;border-radius:30px;
  background:linear-gradient(90deg,var(--pink),var(--purple) 50%,var(--green));
  background-size:200% 100%;animation:shimmer 3s linear infinite;
  transition:width .6s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 12px rgba(255,79,216,.6);}
@keyframes shimmer{from{background-position:0 0;}to{background-position:200% 0;}}
#master-label{font-family:var(--f-head);font-weight:700;font-size:12px;margin-top:3px;color:var(--ink);}
#master-label b{color:var(--green-soft);}

/* ---------------- SHELL (the only scrolling area) --------------- */
#shell{
  flex:1 1 auto;min-height:0;width:min(960px,94vw);margin:6px auto 14px;
  background:rgba(30,15,66,.62);backdrop-filter:blur(7px);
  border:2px solid var(--card-line);border-radius:var(--radius);
  box-shadow:0 0 0 2px rgba(72,255,192,.10),0 18px 60px rgba(0,0,0,.5),inset 0 0 60px rgba(168,107,255,.08);
  overflow:hidden;position:relative;
}
#shell::before{content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
  box-shadow:inset 0 0 22px rgba(255,79,216,.18);}
#content{height:100%;overflow-y:auto;overflow-x:hidden;padding:22px 24px 40px;scroll-behavior:smooth;}
/* transparent custom scrollbar */
#content::-webkit-scrollbar{width:10px;}
#content::-webkit-scrollbar-track{background:transparent;}
#content::-webkit-scrollbar-thumb{background:linear-gradient(var(--pink),var(--purple));
  border-radius:20px;opacity:.5;border:2px solid transparent;background-clip:padding-box;}
#content::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--green),var(--purple));background-clip:padding-box;}
#content{scrollbar-width:thin;scrollbar-color:rgba(168,107,255,.6) transparent;}

/* ---------------- HAMBURGER NAV --------------- */
#hamburger{position:fixed;top:12px;left:12px;z-index:40;width:46px;height:46px;border-radius:14px;
  background:rgba(45,22,86,.8);border:2px solid var(--pink);cursor:pointer;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:var(--glow-pink);transition:.2s;}
#hamburger:hover{transform:scale(1.06);}
#hamburger span{width:22px;height:2.6px;background:var(--green);border-radius:3px;transition:.3s;box-shadow:var(--glow-green);}
#hamburger.open span:nth-child(1){transform:translateY(7.6px) rotate(45deg);}
#hamburger.open span:nth-child(2){opacity:0;}
#hamburger.open span:nth-child(3){transform:translateY(-7.6px) rotate(-45deg);}
#nav{position:fixed;top:66px;left:12px;z-index:39;width:248px;max-height:80vh;overflow-y:auto;
  background:rgba(30,15,66,.96);border:2px solid var(--purple);border-radius:18px;
  box-shadow:0 14px 50px rgba(0,0,0,.6),var(--glow-purple);padding:10px;
  transform:translateX(-120%) scale(.9);opacity:0;pointer-events:none;transition:.32s cubic-bezier(.2,.9,.2,1);}
#nav.open{transform:translateX(0) scale(1);opacity:1;pointer-events:auto;}
#nav a{display:flex;align-items:center;gap:9px;padding:10px 12px;margin:3px 0;border-radius:12px;
  color:var(--ink);text-decoration:none;font-family:var(--f-head);font-weight:600;font-size:15px;transition:.18s;}
#nav a:hover{background:rgba(255,79,216,.18);transform:translateX(4px);color:var(--white);}
#nav a.active{background:linear-gradient(90deg,rgba(255,79,216,.3),rgba(72,255,192,.15));border:1px solid var(--pink);}
#nav .navhead{font-family:var(--f-title);font-size:9px;color:var(--green-soft);padding:8px 12px 2px;letter-spacing:1px;}
#nav .ico{font-size:17px;}

#mute{position:fixed;top:12px;right:12px;z-index:40;width:46px;height:46px;border-radius:14px;
  background:rgba(45,22,86,.8);border:2px solid var(--green);color:var(--green);font-size:18px;cursor:pointer;
  box-shadow:var(--glow-green);transition:.2s;}
#mute:hover{transform:scale(1.06);}

/* ---------------- CONTENT STYLES --------------- */
h2.page-title{font-family:var(--f-head);font-weight:800;font-size:clamp(22px,4vw,30px);margin:0 0 4px;
  color:var(--white);text-shadow:0 0 10px rgba(168,107,255,.6);}
.page-sub{color:var(--ink-dim);margin:0 0 18px;font-size:14px;}
.lead{font-size:15px;line-height:1.6;color:var(--ink);}
a.inline{color:var(--green-soft);font-weight:700;text-decoration:none;border-bottom:1.5px dotted var(--green);}
a.inline:hover{color:var(--white);}

.card{background:var(--card);border:1.5px solid var(--card-line);border-radius:18px;padding:16px 18px;margin:14px 0;
  box-shadow:0 8px 26px rgba(0,0,0,.3);}
.grid{display:grid;gap:14px;}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr;}}

/* unit cards (lesson plan) */
.unit-card{cursor:pointer;border:2px solid var(--card-line);border-radius:20px;padding:16px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,79,216,.10),rgba(168,107,255,.08));transition:.22s;}
.unit-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.4),var(--glow-pink);border-color:var(--pink);}
.unit-card .tag{font-family:var(--f-title);font-size:8px;color:var(--green-soft);letter-spacing:1px;}
.unit-card h3{font-family:var(--f-head);font-weight:800;font-size:19px;margin:6px 0;color:var(--white);}
.unit-card .weight{position:absolute;top:12px;right:14px;font-family:var(--f-head);font-weight:800;
  font-size:20px;color:var(--pink-soft);text-shadow:var(--glow-pink);}
.unit-card p{font-size:13px;color:var(--ink-dim);margin:6px 0 10px;line-height:1.5;}
.mini-bar{height:9px;border-radius:20px;background:rgba(0,0,0,.35);overflow:hidden;}
.mini-bar > i{display:block;height:100%;width:0%;border-radius:20px;
  background:linear-gradient(90deg,var(--green),var(--purple));transition:width .5s;}
.mini-pct{font-family:var(--f-head);font-weight:700;font-size:11px;color:var(--green-soft);margin-top:4px;}

/* checklist + section bar */
.section-block{margin:8px 0 22px;}
.section-bar-shell{height:22px;border-radius:30px;background:rgba(0,0,0,.4);border:1.5px solid var(--card-line);
  overflow:hidden;position:relative;margin:6px 0;}
.section-bar-fill{height:100%;width:0%;border-radius:30px;transition:width .5s cubic-bezier(.2,.9,.2,1);
  background:linear-gradient(90deg,var(--pink),var(--purple) 60%,var(--green));background-size:200% 100%;
  animation:shimmer 3s linear infinite;box-shadow:0 0 10px rgba(72,255,192,.5);}
.section-bar-shell .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-head);font-weight:800;font-size:12px;color:var(--white);text-shadow:0 1px 3px #000;}
.section-bar-shell.done{box-shadow:0 0 18px var(--green);}
.complete-badge{display:inline-block;margin-left:8px;font-family:var(--f-title);font-size:9px;color:var(--green);
  opacity:0;transform:scale(.5);transition:.4s;}
.complete-badge.show{opacity:1;transform:scale(1);animation:pop .5s;}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);}60%{transform:scale(1.25) rotate(4deg);}100%{transform:scale(1) rotate(0);}}

.task-group-title{font-family:var(--f-head);font-weight:700;color:var(--green-soft);font-size:14px;margin:14px 0 4px;
  text-transform:uppercase;letter-spacing:1px;}
ul.checklist{list-style:none;padding:0;margin:0;}
ul.checklist li{display:flex;align-items:flex-start;gap:11px;padding:9px 10px;margin:5px 0;border-radius:13px;
  background:rgba(20,8,46,.4);border:1px solid rgba(255,159,232,.14);cursor:pointer;transition:.16s;}
ul.checklist li:hover{background:rgba(255,79,216,.12);border-color:var(--card-line);}
.box{flex:0 0 24px;width:24px;height:24px;border-radius:8px;border:2.5px solid var(--purple-soft);
  background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;transition:.2s;margin-top:1px;}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.3);transition:.25s;}
li.checked .box{background:linear-gradient(135deg,var(--pink),var(--green));border-color:var(--green);box-shadow:var(--glow-green);}
li.checked .box svg{opacity:1;transform:scale(1);}
li.checked .ttext{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--pink-soft);}
.ttext{font-size:14px;line-height:1.45;}
.ttext .kind{font-family:var(--f-title);font-size:7px;letter-spacing:.5px;padding:2px 5px;border-radius:6px;margin-right:7px;
  vertical-align:middle;}
.k-learn{background:rgba(168,107,255,.3);color:var(--purple-pastel);}
.k-read{background:rgba(72,255,192,.22);color:var(--green-pastel);}
.k-lab{background:rgba(255,79,216,.3);color:var(--pink-pastel);}
.k-quiz{background:rgba(255,209,102,.25);color:#ffe8a8;}
.k-drill{background:rgba(255,255,255,.18);color:#fff;}

/* resource list */
.res{display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:13px;margin:8px 0;
  background:rgba(20,8,46,.45);border:1px solid var(--card-line);transition:.18s;text-decoration:none;color:var(--ink);}
.res:hover{transform:translateX(4px);border-color:var(--green);box-shadow:var(--glow-green);}
.res .ri{font-size:22px;flex:0 0 auto;}
.res b{color:var(--white);font-family:var(--f-head);font-size:15px;}
.res small{display:block;color:var(--ink-dim);font-size:12.5px;margin-top:2px;line-height:1.4;}
.res .free{font-family:var(--f-title);font-size:7px;color:var(--green);margin-left:6px;}
.res .paid{font-family:var(--f-title);font-size:7px;color:var(--pink-soft);margin-left:6px;}

.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-head);font-weight:700;font-size:14px;
  padding:10px 18px;border-radius:14px;border:2px solid var(--pink);background:rgba(255,79,216,.16);
  color:var(--white);cursor:pointer;text-decoration:none;transition:.18s;margin:4px 6px 4px 0;}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glow-pink);background:rgba(255,79,216,.3);}
.btn.green{border-color:var(--green);background:rgba(72,255,192,.14);}
.btn.green:hover{box-shadow:var(--glow-green);}
.back{font-family:var(--f-head);font-weight:700;color:var(--green-soft);cursor:pointer;font-size:14px;margin-bottom:6px;display:inline-block;}
.back:hover{color:var(--white);}

/* tables */
table.kw{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
table.kw th,table.kw td{border:1px solid var(--card-line);padding:7px 9px;text-align:left;}
table.kw th{background:rgba(168,107,255,.22);font-family:var(--f-head);color:var(--white);}
table.kw td{background:rgba(20,8,46,.35);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--f-head);}
.pill.p{background:rgba(255,79,216,.25);color:var(--pink-pastel);}
.pill.g{background:rgba(72,255,192,.2);color:var(--green-pastel);}
.pill.u{background:rgba(168,107,255,.25);color:var(--purple-pastel);}

.callout{border-left:4px solid var(--green);background:rgba(72,255,192,.08);padding:12px 14px;border-radius:0 14px 14px 0;margin:14px 0;font-size:13.5px;line-height:1.55;}
.callout.pink{border-color:var(--pink);background:rgba(255,79,216,.08);}

/* ---------------- CALENDAR --------------- */
.cal-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.cal-toolbar .seg{display:flex;background:rgba(20,8,46,.5);border:1.5px solid var(--card-line);border-radius:14px;overflow:hidden;}
.cal-toolbar .seg button{font-family:var(--f-head);font-weight:700;font-size:13px;padding:8px 14px;border:none;
  background:transparent;color:var(--ink-dim);cursor:pointer;transition:.15s;}
.cal-toolbar .seg button.active{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;}
.cal-nav{margin-left:auto;display:flex;gap:6px;align-items:center;}
.cal-nav button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--purple);background:rgba(45,22,86,.6);
  color:var(--green-soft);font-size:16px;cursor:pointer;}
.cal-title{font-family:var(--f-head);font-weight:800;font-size:16px;color:var(--white);}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.dow{font-family:var(--f-title);font-size:8px;color:var(--green-soft);text-align:center;padding:4px 0;}
.day-cell{min-height:74px;border-radius:12px;border:1.5px solid rgba(255,159,232,.18);padding:5px 6px;
  background:rgba(20,8,46,.4);cursor:pointer;transition:.15s;overflow:hidden;position:relative;}
.day-cell:hover{border-color:var(--pink);transform:scale(1.03);z-index:2;box-shadow:var(--glow-pink);}
.day-cell.empty{background:transparent;border:none;cursor:default;}
.day-cell .dn{font-family:var(--f-head);font-weight:800;font-size:15px;color:var(--white);}
.day-cell .dlabel{font-size:9.5px;line-height:1.25;color:var(--ink-dim);margin-top:2px;}
.day-cell .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;}
.dot.pink{background:var(--pink);box-shadow:var(--glow-pink);}
.dot.purple{background:var(--purple);box-shadow:var(--glow-purple);}
.dot.green{background:var(--green);box-shadow:var(--glow-green);}
.day-cell.today{outline:2px solid var(--green);}
.day-cell.examday{background:linear-gradient(135deg,rgba(255,79,216,.4),rgba(72,255,192,.3));border-color:var(--pink);}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.week-col{background:rgba(20,8,46,.4);border:1.5px solid var(--card-line);border-radius:12px;padding:7px;min-height:120px;}
.week-col h4{font-family:var(--f-head);margin:0 0 4px;font-size:12px;color:var(--green-soft);}
.week-col .wd{font-family:var(--f-head);font-weight:800;font-size:16px;color:var(--white);}
.week-col ul{list-style:none;padding:0;margin:6px 0 0;}
.week-col li{font-size:10.5px;padding:3px 5px;margin:3px 0;border-radius:7px;background:rgba(168,107,255,.18);line-height:1.3;}

.day-view{margin-top:6px;}
.hour-row{display:flex;gap:8px;align-items:stretch;border-top:1px solid rgba(255,159,232,.12);padding:2px 0;}
.hour-row .hr{flex:0 0 64px;font-family:var(--f-head);font-weight:700;font-size:12px;color:var(--green-soft);padding-top:8px;text-align:right;}
.slot{flex:1;min-height:34px;border-radius:10px;padding:7px 10px;cursor:text;font-size:13px;transition:.15s;
  background:rgba(20,8,46,.35);border:1px dashed transparent;display:flex;align-items:center;}
.slot:hover{background:rgba(255,79,216,.1);border-color:var(--card-line);}
.slot.study{background:rgba(168,107,255,.22);border:1px solid rgba(168,107,255,.4);font-weight:600;color:var(--white);}
.slot.life{background:rgba(72,255,192,.12);color:var(--green-pastel);}
.slot.empty-slot{color:#7a679a;font-style:italic;}
.slot input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--green);border-radius:8px;color:#fff;
  font-family:var(--f-body);font-size:13px;padding:5px 8px;}

/* ---------------- CELEBRATION OVERLAY --------------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden;}
.conf{position:absolute;top:-20px;width:11px;height:11px;border-radius:3px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg);}}
#celebrate{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(80,20,120,.55),rgba(10,4,24,.85));backdrop-filter:blur(3px);}
#celebrate.show{display:flex;animation:fadein .4s;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
#celebrate .box{text-align:center;padding:30px;}
#celebrate h2{font-family:var(--f-title);font-size:clamp(18px,5vw,34px);color:var(--white);
  text-shadow:0 0 14px var(--pink),0 0 28px var(--purple);animation:wob 1s ease-in-out infinite;}

/* ============================================================
   AUDIO (Web Audio API — generated, no files needed)
   ============================================================ */
let actx=null;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==="suspended")actx.resume();}
function tone(freq,start,dur,type="triangle",vol=0.18){
  if(!actx||muted)return;const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+start;g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.start(t);o.stop(t+dur+0.02);
}
function playTick(){ensureAudio();if(!actx||muted)return;const f=620+Math.random()*180;tone(f,0,0.09,"square",0.10);tone(f*1.5,0.02,0.06,"sine",0.05);}
function playSection(){ensureAudio();if(!actx||muted)return;[523,659,784,1047].forEach((f,i)=>tone(f,i*0.10,0.22,"triangle",0.16));tone(1568,0.42,0.4,"sine",0.10);}
function playMaster(){ensureAudio();if(!actx||muted)return;
  const seq=[523,587,659,784,880,1047,1319];seq.forEach((f,i)=>tone(f,i*0.11,0.25,"triangle",0.16));
  [523,659,784,1047].forEach(f=>tone(f,0.85,0.9,"triangle",0.12)); // chord
  tone(1568,0.9,1.0,"sine",0.10);tone(2093,1.0,0.8,"sine",0.07);}
function toggleMute(){muted=!muted;try{localStorage.setItem(MKEY,muted?"1":"0");}catch(e){}
  document.getElementById("mute").textContent=muted?"🔇":"🔊";}

function confetti(n,big){
  const wrap=document.getElementById("confetti");
  for(let i=0;i<n;i++){const c=document.createElement("div");c.className="conf";
    c.style.left=Math.random()*100+"vw";c.style.background=PAL[i%PAL.length];

    c.style.animationDelay=Math.random()*(big?0.5:0.2)+"s";
    const sz=(big?8:7)+Math.random()*8;c.style.width=sz+"px";c.style.height=sz+"px";
    if(Math.random()>0.5)c.style.borderRadius="50%";
